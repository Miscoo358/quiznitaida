<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tourism &amp; Hospitality Marketing: answer key and mock quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2efe8; --surface:#fffdf8; --ink:#241f16; --muted:#6b6255; --line:#ddd5c4;
  --accent:#a6472e; --accent-ink:#fff8f0; --accent-soft:#f3ddd4;
  --gold:#8a6b1f; --gold-soft:#f1e6c8; --ok:#3c6e4a; --ok-soft:#dcead9; --bad:#a6472e; --bad-soft:#f3ddd4;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171310; --surface:#1f1a15; --ink:#efe7da; --muted:#b1a591; --line:#3a3226;
    --accent:#e08a6f; --accent-ink:#241108; --accent-soft:#3a251d;
    --gold:#d9b85a; --gold-soft:#3a301a; --ok:#7fbf8f; --ok-soft:#1f3324; --bad:#e08a6f; --bad-soft:#3a251d;
  }
}
:root[data-theme="dark"]{
  --bg:#171310; --surface:#1f1a15; --ink:#efe7da; --muted:#b1a591; --line:#3a3226;
  --accent:#e08a6f; --accent-ink:#241108; --accent-soft:#3a251d;
  --gold:#d9b85a; --gold-soft:#3a301a; --ok:#7fbf8f; --ok-soft:#1f3324; --bad:#e08a6f; --bad-soft:#3a251d;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16.5px;line-height:1.55}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:500;line-height:1.15;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:800px;margin:0 auto;padding:14px 20px 0}
.top h1{font-size:1.4rem}
.sub{margin:3px 0 10px;color:var(--muted);font-size:.92rem}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;font-size:.95rem}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{max-width:800px;margin:0 auto;padding:22px 20px 60px}
.panel[hidden]{display:none}

/* answer key */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.tools input[type=search]{flex:1 1 200px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.link-btn{background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;padding:6px 2px;font-size:.9rem}
.count{color:var(--muted);font-size:.88rem;margin:0 0 6px}
h2.sec{font-size:1.3rem;margin:34px 0 4px;padding-top:6px}
h3.grp{font-family:"Inter",system-ui,sans-serif;font-size:.95rem;font-weight:700;color:var(--gold);margin:22px 0 4px;text-transform:none}
details.item{border-top:1px solid var(--line)}
details.item:last-of-type{border-bottom:1px solid var(--line)}
details.item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.2rem 1fr 1.2rem;gap:8px;padding:12px 0;align-items:start}
details.item summary::-webkit-details-marker{display:none}
details.item summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:8px;transition:transform .15s}
details.item[open] summary::after{transform:rotate(-135deg);margin-top:11px}
.num{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.qt{font-weight:600}
.ans{padding:0 0 14px 2.2rem}
.ans ul{margin:0 0 8px;padding-left:1.1rem}
.ans li{margin:3px 0}
.term{font-weight:700}

/* quiz setup */
.lead{color:var(--muted);margin:0 0 18px;max-width:62ch}
.setup{display:grid;gap:16px;max-width:520px}
.setup label{display:grid;gap:4px;font-weight:600}
.setup select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.setup .check{display:flex;gap:10px;align-items:center;font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

/* taking the quiz */
.qz-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.qz-head h2{font-size:1.05rem;color:var(--muted);font-family:"Inter",sans-serif;font-weight:700}
.qz-progress{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:600;font-size:.9rem}
.qbar{height:4px;background:var(--line);border-radius:2px;margin:0 0 22px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent)}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 20px 8px;margin-bottom:22px}
.pq{display:flex;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.pq:first-child{border-top:0;padding-top:2px}
.pnum{font-weight:700;color:var(--accent);flex:none;width:1.8rem;font-variant-numeric:tabular-nums}
.pbody{flex:1;min-width:0}
.ptopic{color:var(--muted);font-size:.82rem;margin:0 0 3px}
.pstem{font-weight:600;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.opt input{margin-top:4px;flex:none;accent-color:var(--accent)}
.opt .lab{font-weight:700;color:var(--muted);flex:none;width:1.1rem}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.submit-bar{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--bg);border-top:1px solid var(--line);padding:12px 0 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.unanswered{color:var(--muted);font-size:.88rem}

/* results / answer sheet */
.result-big{font-family:"Fraunces",Georgia,serif;font-size:3rem;line-height:1;margin:8px 0}
.result-sub{color:var(--muted);margin:0 0 22px}
.sheet-title{font-size:1.05rem;margin:0 0 10px;font-family:"Inter",sans-serif;font-weight:700;color:var(--muted)}
.bubble-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:26px}
.bubble{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px;background:var(--surface)}
.bubble.correct{border-color:var(--ok);background:var(--ok-soft)}
.bubble.wrong{border-color:var(--bad);background:var(--bad-soft)}
.bnum{font-weight:700;font-variant-numeric:tabular-nums;width:1.6rem;flex:none}
.bletters{display:flex;gap:4px}
.bletter{width:1.5rem;height:1.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;border:1px solid var(--line);color:var(--muted)}
.bletter.your{border-color:var(--ink);color:var(--ink)}
.bletter.right{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.bletter.your.wrong-pick{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.review{margin-top:8px}
.review-item{border-top:1px solid var(--line);padding:16px 0}
.review-item:first-child{border-top:0}
.rhead{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.tag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;flex:none}
.tag.correct{background:var(--ok-soft);color:var(--ok)}
.tag.wrong{background:var(--bad-soft);color:var(--bad)}
.rq{font-weight:600}
.ropts{list-style:none;margin:8px 0;padding:0;font-size:.95rem}
.ropts li{padding:5px 0 5px 1.6rem;position:relative}
.ropts li.right::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:700}
.ropts li.picked-wrong::before{content:"✕";position:absolute;left:0;color:var(--bad);font-weight:700}
.ropts li.right{font-weight:600}
.explain{background:var(--gold-soft);border-radius:8px;padding:10px 12px;font-size:.92rem;margin-top:6px}
.weak{list-style:none;margin:10px 0 0;padding:0}
.weak li{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--line);font-size:.95rem}

@media (max-width:520px){
  body{font-size:16px}
  .ans{padding-left:0}
  details.item summary{grid-template-columns:1.9rem 1fr 1rem}
  .bubble-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .top,.tools,#tab-quiz{display:none!important}
  #tab-key{display:block!important}
  body{background:#fff;color:#000}
  details.item{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1>Tourism &amp; Hospitality Marketing</h1>
    <p class="sub">Answer key and a mock quiz with a graded answer sheet — Lectures 1–4</p>
    <nav class="tabs" role="tablist" aria-label="Study modes">
      <button role="tab" id="t-key" data-tab="key" aria-selected="true" aria-controls="tab-key">Answer key</button>
      <button role="tab" id="t-quiz" data-tab="quiz" aria-selected="false" aria-controls="tab-quiz">Mock quiz</button>
    </nav>
  </div>
</header>

<main>
  <section id="tab-key" class="panel" role="tabpanel" aria-labelledby="t-key">
    <div class="tools">
      <input type="search" id="q" placeholder="Search questions and answers" aria-label="Search the answer key">
      <div class="chips" id="chips">
        <button class="chip" data-f="ALL" aria-pressed="true">All</button>
        <button class="chip" data-f="L1" aria-pressed="false">Lecture 1</button>
        <button class="chip" data-f="L2" aria-pressed="false">8 Ps</button>
        <button class="chip" data-f="L3" aria-pressed="false">Consumer behavior</button>
        <button class="chip" data-f="L4" aria-pressed="false">Environment &amp; competition</button>
      </div>
      <button class="link-btn" id="expand">Expand all</button>
    </div>
    <p class="count" id="count"></p>
    <div id="key-root"></div>
  </section>

  <section id="tab-quiz" class="panel" role="tabpanel" aria-labelledby="t-quiz" hidden>
    <div id="quiz-root"></div>
  </section>
</main>

<script>
(function(){
"use strict";

var SEC = {
  L1:"Lecture 1: Foundational concepts",
  L2:"Lectures 2–3: The 8 Ps service marketing mix",
  L3:"Lesson 3: Tourism consumer behavior",
  L4:"Lecture 4: Marketing environment and competitive analysis"
};

/* =================== ANSWER KEY (open-ended study notes) =================== */
var KEY = [
/* ---- LECTURE 1 ---- */
{n:1,s:"L1",g:"Marketing basics",q:"How does the module define marketing, and how does that differ from tourism and hospitality marketing specifically?",
 a:["Marketing is the process for getting a company's product or service out to consumers.",
    "Tourism and hospitality marketing is how segments of the tourism industry promote their products or services to prospective travelers and guests.",
    "It covers market research, product positioning, promotion, pricing, and distribution strategies that connect businesses with buyers."]},
{n:2,s:"L1",g:"Marketing basics",q:"Why does hospitality need a tailored marketing approach instead of traditional product marketing tactics?",
 a:["Tourism and hospitality belong strictly to the service sector.",
    "Hospitality offerings are intangible experiences, real-time service performances, and personal interactions, unlike physical manufactured products.",
    "Traditional physical-product tactics fail here; specialized strategies are needed for intangibility, perishability, and simultaneous production."]},
{n:3,s:"L1",g:"Marketing basics",q:"Name and explain the three components of the marketing concept.",
 a:["Guest needs, wants, and demands: understanding and satisfying what guests need, want, and are willing to pay for is the primary focus.",
    "Sustainable profitability: companies aim to profit by satisfying customer demands more effectively and efficiently than competitors.",
    "Integrated marketing: marketing is a concerted effort from everyone in the company, from frontline staff to senior management."]},
{n:4,s:"L1",g:"Characteristics of tourism services",q:"Explain service intangibility and service inseparability, with their marketing implications.",
 a:["Intangibility: hospitality products cannot be seen, tasted, felt, heard, or smelled before purchase. Implication: marketers must provide strong physical evidence and brand signals to reduce buyer uncertainty.",
    "Inseparability: the service provider and the customer must interact for the transaction to happen. Implication: frontline staff become co-creators of the experience and brand ambassadors."]},
{n:5,s:"L1",g:"Characteristics of tourism services",q:"Explain perishability of inventory and demand variability, with their marketing implications.",
 a:["Perishability: unsold hotel rooms or airline seats cannot be stored for future sale; an unsold room tonight is revenue lost forever. Implication: dynamic pricing, yield management, and promotional discounting balance supply and demand.",
    "Demand variability: tourism demand is heavily influenced by seasonality, economic shifts, weather, and geopolitical events. Implication: strategies must target off-peak segments (conventions, business travel) to stabilize revenue."]},
{n:6,s:"L1",g:"Customer needs and demands",q:"What three ideas describe how tourism fulfills guest expectations?",
 a:["Needs vs. wants: tourism addresses psychological needs for rest, escape, and self-actualization.",
    "The experience economy: guests buy memorable experiences and emotional moments, not just a room.",
    "No ownership: consumers buy the temporary right to use a service without owning any physical asset."]},
{n:7,s:"L1",g:"Industry metrics",q:"Why is retention valued so highly in hospitality marketing?",
 a:["It costs up to five times more to attract a new customer than to retain an existing guest.",
    "Repeat visitors spend more per trip and lower customer acquisition costs significantly."]},
{n:8,s:"L1",g:"Marketing strategies",q:"Differentiate brand marketing, emotional engagement, and place marketing.",
 a:["Brand marketing: developing distinct visual and experiential signatures that set a resort or airline apart from competitors.",
    "Emotional engagement: using storytelling, imagery, and sensory cues to evoke nostalgia, excitement, or relaxation.",
    "Place marketing: promoting geographic locations as compelling destinations with unique cultural and recreational value."]},
{n:9,s:"L1",g:"Specialized tactics",q:"What is affinity marketing, and how does it differ from multi-channel distribution?",
 a:["Affinity marketing: partnering with organizations, credit cards, or alumni associations to target group affiliations with tailored packages and co-branded offers.",
    "Multi-channel distribution: combining direct booking channels (website, apps) with OTAs, global distribution systems (GDS), and travel agents."]},
{n:10,s:"L1",g:"Traditional vs. tourism marketing",q:"Compare traditional product marketing and tourism and hospitality marketing across product nature, production/consumption, inventory, and the human element.",
 a:["Product nature: tangible goods with physical ownership vs. intangible experience and temporary access.",
    "Production and consumption: separated in space and time vs. simultaneous (inseparable).",
    "Inventory storage: can be warehoused for future demand vs. perishable, zero shelf life.",
    "Human element: factory processes hidden from the buyer vs. frontline staff directly define product quality."]},
{n:11,s:"L1",g:"Marketing planning process",q:"Name and describe the four stages of the marketing planning process.",
 a:["Audit and research: analyze market environment, competitor positioning, and guest segments.",
    "Targeting: select high-yield visitor segments and define value propositions.",
    "Campaign mix: deploy digital ads, OTAs, social proof, and emotional campaigns.",
    "Review and loyalty: monitor online reviews, guest satisfaction, and repeat visit rate."]},

/* ---- LECTURE 2/3: 8 Ps ---- */
{n:12,s:"L2",g:"Unique nature of services",q:"Lesson 2 restates the unique nature of tourism services as four points. What are they?",
 a:["Intangible experience: guests buy an emotional memory and time-bound access, not a physical trial.",
    "Simultaneous production and consumption: the service is created in real time in front of the guest.",
    "Perishable inventory: unsold rooms or cruise cabin nights cannot be stored; lost revenue is gone forever.",
    "Heterogeneous output: service quality varies with staff performance, guest mood, and operational circumstances."]},
{n:13,s:"L2",g:"1st P: Product",q:"What is the tourism product structure, and what is the difference between facilitating and enhancing services?",
 a:["The product combines tangible physical facilities (rooms, food, amenities) with intangible core benefits (rest, prestige, recreation, safety).",
    "Facilitating services: essential elements guests need to consume the core service, e.g., check-in desk, reservation portal, keycards.",
    "Enhancing services: value-added elements that differentiate the brand, e.g., fine dining, personalized butler service, airport shuttle."]},
{n:14,s:"L2",g:"2nd P: Place",q:"Differentiate direct and indirect (intermediary) distribution.",
 a:["Direct distribution: booking directly via brand websites, apps, or the front desk; maximizes profit margin and gives direct ownership of guest relationship data.",
    "Indirect distribution: OTAs (Agoda, Booking.com), GDS, and tour operators reach global market segments through intermediaries."]},
{n:15,s:"L2",g:"3rd P: Price",q:"What is RevPAR, and what are rate fences?",
 a:["RevPAR: Revenue Per Available Room, a key yield metric.",
    "Dynamic pricing: revenue management systems adjust rates based on demand seasonality, booking windows, lead times, and competitor benchmarks.",
    "Rate fences: rules such as non-refundable terms, length-of-stay requirements, and advance-purchase discounts used to segment price-sensitive guests."]},
{n:16,s:"L2",g:"3rd P: Price",q:"What is the “pricing tripod” in hospitality?",
 a:["Hospitality rates must balance guest perceived value, operating cost recovery, and competitiveness in destination markets, all at once."]},
{n:17,s:"L2",g:"4th P: Promotion",q:"What three tactics does the module list under promotion and “tangibilizing” the service?",
 a:["Tangibilizing the service: high-definition imagery, virtual tours, and sensory descriptions make intangible experiences tangible.",
    "User-generated content: guest social media posts, travel vlogs, and review portals (TripAdvisor) create authentic social proof.",
    "Destination partnerships: co-branding between hotels, airlines, and local tourism boards (DMOs) creates compelling travel packages."]},
{n:18,s:"L2",g:"5th P: People",q:"What roles do frontline personnel, emotional labor, and internal marketing play?",
 a:["Frontline personnel: front desk agents, concierges, and servers represent the face of the brand.",
    "Emotional labor: staff perform emotional labor to consistently deliver genuine warmth, empathy, and hospitality.",
    "Internal marketing: recruiting, training, and empowering employees so they deliver exceptional guest experiences."]},
{n:19,s:"L2",g:"6th P: Process",q:"What is service blueprinting, and what is self-service technology (SST)?",
 a:["Service blueprinting: mapping the entire guest journey from pre-arrival booking to post-checkout departure, identifying frontstage interactions, backstage operations, and potential service fail points.",
    "Self-service technology: contactless check-in kiosks, digital room keys, and mobile ordering, reducing wait times while maintaining service reliability."]},
{n:20,s:"L2",g:"7th P: Physical evidence",q:"What is the hospitality servicescape, and why does it matter?",
 a:["It is the physical environment, including architecture, interior design, lighting, music, scent, and cleanliness, that shapes guest expectations and emotional comfort.",
    "Every tangible element communicates brand positioning, whether a rustic eco-lodge or an ultra-luxury urban hotel."]},
{n:21,s:"L2",g:"8th P: Partnership",q:"Why does the module add an 8th P, and what does it cover?",
 a:["In tourism, no single supplier operates in isolation; success depends on collaborative networks among transport providers, lodging, attractions, and local governments.",
    "Strategic alliances: airline code-shares, hotel-airline loyalty point integrations, and regional destination marketing alliances expand market reach and add customer value."]},
{n:22,s:"L2",g:"Summary matrix",q:"Match each of the 8 Ps to its strategic marketing objective, per the summary matrix.",
 a:["Product → creating memorable guest experiences.",
    "Place → maximizing booking accessibility.",
    "Price → optimizing RevPAR and guest yield.",
    "Promotion → tangibilizing service promises.",
    "People → delivering warm hospitality and empathy.",
    "Process → eliminating friction and service failures.",
    "Physical evidence → signaling quality through the servicescape.",
    "Partnership → delivering seamless destination travel."]},
{n:23,s:"L2",g:"Core principle",q:"What is the module's core principle statement about marketing in tourism and hospitality?",
 a:["“In tourism and hospitality, marketing is not merely a department, it is an all-pervading philosophy where every guest interaction is a moment of truth.”"]},

/* ---- LESSON 3: Consumer behavior ---- */
{n:24,s:"L3",g:"Consumption model",q:"Name and describe the three stages of the guest consumption model.",
 a:["Pre-purchase stage: need arousal (wanderlust), information search, risk evaluation, and selecting among destination alternatives.",
    "Service encounter stage: direct interaction with the resort, airline, or attraction; experiencing moments of truth live.",
    "Post-encounter stage: evaluating the experience against expectations, leading to delight, repeat loyalty, or negative word of mouth."]},
{n:25,s:"L3",g:"Travel motivators",q:"Differentiate push and pull factors in travel motivation.",
 a:["Push factors (internal): stress relief, escape, self-discovery, social status, and quality time with family.",
    "Pull factors (external): tropical beaches, cultural heritage sites, luxury resorts, safety, and local gastronomy."]},
{n:26,s:"L3",g:"Evaluating attributes",q:"Differentiate search, experience, and credence attributes, with an example of each.",
 a:["Search attributes: evaluated before booking, e.g., room rates, location, star rating, photos, amenities list.",
    "Experience attributes: felt only during the stay, e.g., bed comfort, food flavor, staff friendliness, pool atmosphere.",
    "Credence attributes: hard to evaluate even after the stay, e.g., kitchen food safety standards, eco-sustainability practices."]},
{n:27,s:"L3",g:"Perceived risk",q:"Name the four types of perceived travel and booking risk, with an example of each.",
 a:["Functional risk: resort facilities failing to meet advertised standards, or bad weather.",
    "Physical risk: safety concerns, illness in unfamiliar destinations, or transportation accidents.",
    "Financial risk: overpaying, or non-refundable cancellation penalties during emergencies.",
    "Psychological risk: fear of wasted vacation time and ruined family memories."]},
{n:28,s:"L3",g:"Expectations",q:"What is the zone of tolerance, and how does it relate to desired vs. adequate service?",
 a:["Desired service: the ideal performance level the guest hopes to receive.",
    "Adequate service: the minimum acceptable threshold tolerated without dissatisfaction.",
    "Zone of tolerance: the range of acceptable variation between the two; narrow for critical touchpoints (room cleanliness, check-in speed), wider for minor non-essential services."]},
{n:29,s:"L3",g:"Experience economy",q:"Name the Pine and Gilmore “4 Es,” with an example of each.",
 a:["Entertainment: passive absorption, e.g., shows, music.",
    "Educational: active learning, e.g., cooking classes, heritage tours.",
    "Escapist: immersive action, e.g., adventure sports.",
    "Esthetic: immersive appreciation, e.g., scenic landscapes, luxury ambiance."]},
{n:30,s:"L3",g:"Servuction model",q:"Name the three visible elements of the servuction model in hospitality.",
 a:["Inanimate environment: physical décor, furniture, temperature, layout, and lighting visible to the guest.",
    "Contact personnel: frontline staff directly interacting with guests and guiding their service journey.",
    "Other customers: the behavior of fellow guests affects the atmosphere, e.g., a noisy dining room vs. a tranquil spa."]},
{n:31,s:"L3",g:"Touchpoint intensity",q:"Differentiate high-contact and low-contact service encounters.",
 a:["High-contact: guests physically enter the facility and remain throughout delivery (full-service resorts, fine dining, cruises); human touchpoints drive over 80% of guest satisfaction.",
    "Low-contact: transactions occur digitally or at a distance (automated motel check-in, app-based food delivery); success depends on technological reliability and frictionless UX."]},
{n:32,s:"L3",g:"Satisfaction model",q:"Explain the expectation disconfirmation model and its three outcomes.",
 a:["Guests compare actual service performance against pre-purchase expectations.",
    "Positive disconfirmation: performance exceeds expectation → delight.",
    "Simple confirmation: performance matches expectation → satisfaction.",

$("#expand").addEventListener("click",function(){
  keyState.open=!keyState.open;
  $$("#key-root details").forEach(function(d){d.open=keyState.open;});
  $("#expand").textContent=keyState.open?"Collapse all":"Expand all";
});
window.addEventListener("beforeprint",function(){$$("#key-root details").forEach(function(d){d.open=true;});});

/* ---------- mock quiz ---------- */
var qz={stage:"setup",deck:[],picks:[],opts:{scope:"ALL",count:"20",shuffleQ:true,shuffleO:true}};

function renderSetup(){
  qz.stage="setup";
  var o=qz.opts;
  $("#quiz-root").innerHTML=
   '<p class="lead">A multiple-choice quiz built from the four lectures. Answer every item, submit, and you will get a graded answer sheet — your picks against the correct letters — plus a full review.</p>'+
   '<div class="setup">'+
   '<label>Topic<select id="o-scope">'+
     '<option value="ALL"'+(o.scope==="ALL"?" selected":"")+'>All lectures (48 items)</option>'+
     '<option value="L1"'+(o.scope==="L1"?" selected":"")+'>Lecture 1: Foundational concepts (9)</option>'+
     '<option value="L2"'+(o.scope==="L2"?" selected":"")+'>Lectures 2–3: The 8 Ps (11)</option>'+
     '<option value="L3"'+(o.scope==="L3"?" selected":"")+'>Lesson 3: Consumer behavior (12)</option>'+
     '<option value="L4"'+(o.scope==="L4"?" selected":"")+'>Lecture 4: Environment &amp; competition (16)</option>'+
   '</select></label>'+
   '<label>Number of items<select id="o-count">'+
     ["10","20","30","all"].map(function(v){return '<option value="'+v+'"'+(o.count===v?" selected":"")+'>'+(v==="all"?"All in topic":v)+'</option>';}).join("")+
   '</select></label>'+
   '<label class="check"><input type="checkbox" id="o-shuffleq"'+(o.shuffleQ?" checked":"")+'> Shuffle question order</label>'+
   '<label class="check"><input type="checkbox" id="o-shuffleo"'+(o.shuffleO?" checked":"")+'> Shuffle answer choices</label>'+
   '</div>'+
   '<div class="row"><button class="btn primary" data-act="start">Start quiz</button></div>';
}

function buildDeck(){
  qz.opts.scope=$("#o-scope").value;
  qz.opts.count=$("#o-count").value;
  qz.opts.shuffleQ=$("#o-shuffleq").checked;
  qz.opts.shuffleO=$("#o-shuffleo").checked;
  var pool=QUIZ.filter(function(d){return qz.opts.scope==="ALL"||d.s===qz.opts.scope;});
  if(qz.opts.shuffleQ)pool=shuffle(pool);
  var n=qz.opts.count==="all"?pool.length:Math.min(+qz.opts.count,pool.length);
  pool=pool.slice(0,n);
  return pool.map(function(d){
    var order=[0,1,2,3];
    if(qz.opts.shuffleO)order=shuffle(order);
    return {
      src:d,
      opts:order.map(function(i){return d.o[i];}),
      correctIdx:order.indexOf(d.c)
    };
  });
}

function renderPaper(){
  qz.stage="taking";
  var html='<div class="qz-head"><h2>Answer every item, then submit</h2><span class="qz-progress" id="progress"></span></div>'+
    '<div class="qbar"><i id="qbar-fill" style="width:0%"></i></div><div class="paper" id="paper">';
  qz.deck.forEach(function(item,i){
    html+='<div class="pq"><span class="pnum">'+(i+1)+'.</span><div class="pbody">'+
      '<p class="ptopic">'+esc(item.src.t)+'</p><p class="pstem">'+esc(item.src.q)+'</p><div class="opts">'+
      item.opts.map(function(opt,k){
        return '<label class="opt" data-qi="'+i+'" data-oi="'+k+'"><input type="radio" name="q'+i+'" value="'+k+'"><span class="lab">'+LETTERS[k]+'</span><span>'+esc(opt)+'</span></label>';
      }).join("")+
      '</div></div></div>';
  });
  html+='</div><div class="submit-bar"><span class="unanswered" id="unanswered"></span><button class="btn primary" data-act="submit">Submit quiz</button></div>';
  $("#quiz-root").innerHTML=html;
  updateProgress();
}

function updateProgress(){
  var answered=qz.picks.filter(function(p){return p!=null;}).length,total=qz.deck.length;
  var pe=$("#progress");if(pe)pe.textContent=answered+" of "+total+" answered";
  var pb=$("#qbar-fill");if(pb)pb.style.width=Math.round(answered/total*100)+"%";
  var ua=$("#unanswered");
  if(ua)ua.textContent=answered<total?(total-answered)+" question"+((total-answered)===1?"":"s")+" left blank":"All questions answered";
}

$("#quiz-root").addEventListener("click",function(e){
  var opt=e.target.closest(".opt");
  if(opt&&qz.stage==="taking"){
    var qi=+opt.getAttribute("data-qi"),oi=+opt.getAttribute("data-oi");
    qz.picks[qi]=oi;
    $$('.opt[data-qi="'+qi+'"]').forEach(function(o){o.classList.remove("picked");});
    opt.classList.add("picked");
    var input=opt.querySelector("input");if(input)input.checked=true;
    updateProgress();
    return;
  }
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.getAttribute("data-act");
  if(act==="start"){
    qz.deck=buildDeck();
    qz.picks=qz.deck.map(function(){return null;});
    renderPaper();
    window.scrollTo(0,0);
  }else if(act==="submit"){
    renderResults();
    window.scrollTo(0,0);
  }else if(act==="again"){
    renderSetup();
  }else if(act==="retry-wrong"){
    var wrongSrcs=qz._wrongSrcs||[];
    var pool=wrongSrcs;
    qz.deck=pool.map(function(d){
      var order=[0,1,2,3];
      if(qz.opts.shuffleO)order=shuffle(order);
      return {src:d,opts:order.map(function(i){return d.o[i];}),correctIdx:order.indexOf(d.c)};
    });
    qz.picks=qz.deck.map(function(){return null;});
    renderPaper();
    window.scrollTo(0,0);
  }
});

function renderResults(){
  qz.stage="results";
  var total=qz.deck.length,correctCount=0,wrongSrcs=[];
  qz.deck.forEach(function(item,i){
    if(qz.picks[i]===item.correctIdx)correctCount++;
    else wrongSrcs.push(item.src);
  });
  qz._wrongSrcs=wrongSrcs;
  var pct=Math.round(correctCount/total*100);
  var msg=pct>=90?"Excellent recall across the lectures.":
          pct>=75?"Good grasp overall — review the missed items below.":
          pct>=50?"Getting there. Reread the sections behind your misses.":
          "Worth another pass through the answer key before you retry.";

  var html='<h2>Score</h2><p class="result-big">'+correctCount+' / '+total+'</p>'+
    '<p class="result-sub">'+pct+'% correct. '+msg+'</p>';

  html+='<p class="sheet-title">Answer sheet</p><div class="bubble-grid">';
  qz.deck.forEach(function(item,i){
    var picked=qz.picks[i];
    var isRight=picked===item.correctIdx;
    html+='<div class="bubble '+(isRight?"correct":"wrong")+'"><span class="bnum">'+(i+1)+'.</span><span class="bletters">';
    for(var k=0;k<item.opts.length;k++){
      var cls="bletter";
      var isYour=(picked===k);
      var isCorrectLetter=(k===item.correctIdx);
      if(isCorrectLetter)cls+=" right";
      if(isYour){cls+=" your";if(!isRight)cls+=" wrong-pick";}
      html+='<span class="'+cls+'">'+LETTERS[k]+'</span>';
    }
    html+='</span></div>';
  });
  html+='</div>';

  html+='<p class="sheet-title">Review</p><div class="review">';
  qz.deck.forEach(function(item,i){
    var picked=qz.picks[i];
    var isRight=picked===item.correctIdx;
    html+='<div class="review-item"><div class="rhead"><span class="tag '+(isRight?"correct":"wrong")+'">'+(isRight?"Correct":picked==null?"Blank":"Incorrect")+'</span><span class="rq">'+(i+1)+'. '+esc(item.src.q)+'</span></div><ul class="ropts">'+
      item.opts.map(function(opt,k){
        var cls="";
        if(k===item.correctIdx)cls="right";
        else if(k===picked)cls="picked-wrong";
        return '<li class="'+cls+'">'+LETTERS[k]+'. '+esc(opt)+'</li>';
      }).join("")+
      '</ul><p class="explain">'+esc(item.src.ex)+'</p></div>';
  });
  html+='</div>';

  html+='<div class="row">'+(wrongSrcs.length?'<button class="btn primary" data-act="retry-wrong">Retry the '+wrongSrcs.length+' missed item'+(wrongSrcs.length===1?"":"s")+'</button>':'')+
    '<button class="btn'+(wrongSrcs.length?'':' primary')+'" data-act="again">New quiz</button></div>';

  $("#quiz-root").innerHTML=html;
}

renderKey();
renderSetup();
})();
</script>
</body>
</html>
